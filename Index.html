  const stepOpts = (S.cfg.leaveSteps || []).slice(0, 4);
  mainEl().innerHTML = `
  <div class="head-row">
    <h2 class="page-title" style="margin:0">การลา (ระบบอนุมัติ 4 ขั้นตอน)</h2>
    <button class="btn btn-pri" onclick="openLeaveForm()">+ เขียนใบลา</button>
  </div>
  <div class="stats" id="lvStats"></div>
  <div class="card" style="margin-bottom:16px">
    <div class="toolbar">
      <input id="lq" class="input grow" placeholder="${isStaff() ? 'ค้นหาชื่อ / ตำแหน่ง / เหตุผล' : 'ค้นหาเหตุผล'}" value="${esc(LF.q)}">
      <select id="lt" class="input"><option value="">ทุกประเภทการลา</option>${opts(S.cfg.leaveTypes, LF.type)}</select>
      <select id="ls" class="input">
        <option value="">ทุกสถานะ</option>
        ${stepOpts.map(st => `<option value="${st}" ${LF.status === st ? 'selected' : ''}>⏳ ${esc(st)}</option>`).join('')}
        <option value="อนุมัติแล้ว" ${LF.status === 'อนุมัติแล้ว' ? 'selected' : ''}>✅ อนุมัติแล้ว</option>
        <option value="ไม่อนุมัติ" ${LF.status === 'ไม่อนุมัติ' ? 'selected' : ''}>⛔ ไม่อนุมัติ</option>
        <option value="ยกเลิก" ${LF.status === 'ยกเลิก' ? 'selected' : ''}>❌ ยกเลิก</option>
      </select>
      <select id="lf" class="input"><option value="">ทุกปีงบประมาณ</option>${fys.map(y => `<option value="${y}" ${LF.fy === y ? 'selected' : ''}>ปีงบประมาณ ${y}</option>`).join('')}</select>
    </div>
    <div class="table-wrap"><table class="tbl"><thead><tr>
      <th>#</th><th>ผู้ลา</th><th>ประเภท</th><th>วันที่ลา</th><th>จำนวน</th><th>เหตุผล</th><th>สถานะ / ขั้นตอน</th><th>ไฟล์</th><th>จัดการ</th>
    </tr></thead><tbody id="lvBody"><tr><td colspan="9" class="empty">กำลังโหลดขั้นตอน...</td></tr></tbody></table></div>
    <div class="footer-info" id="lvCount"></div>
  </div>
  ${isStaff() ? `<div class="card"><h3>สรุปวันลาที่อนุมัติแล้ว รายบุคคล <span class="sub" id="lvSumFy"></span></h3><div class="table-wrap" id="lvSum"></div></div>` : ''}`;

  $('#lq').oninput = e => { LF.q = e.target.value; drawLeave(); };
  $('#lt').onchange = e => { LF.type = e.target.value; drawLeave(); };
  $('#ls').onchange = e => { LF.status = e.target.value; drawLeave(); };
  $('#lf').onchange = e => { LF.fy = e.target.value; drawLeave(); };
  loadLeave();
}

async function loadLeave(){
  try {
    const list = await api('listLeave', S.token);
    if (S.page !== 'leave') return;
    S.list = list || [];
    setLeaveBadge(S.list.filter(r => (r.status || '').indexOf('รออนุมัติ') >= 0 && (isStaff() || r.username === S.user.username)).length);
    drawLeave();
  } catch (e) {
    handleErr(e);
    if ($('#lvBody')) $('#lvBody').innerHTML = `<tr><td colspan="9" class="empty">โหลดข้อมูลไม่สำเร็จ</td></tr>`;
  }
}

function setLF(status){ LF.status = status; if ($('#ls')) $('#ls').value = status; drawLeave(); }
function setLFType(t){ LF.type = LF.type === t ? '' : t; if ($('#lt')) $('#lt').value = LF.type; drawLeave(); }

function drawLeave(){
  if (!$('#lvBody')) return;
  const inFy = S.list.filter(r => !LF.fy || String(r.fy) === LF.fy);

  if (isStaff()) {
    const pendCount = inFy.filter(r => (r.status || '').indexOf('รออนุมัติ') >= 0).length;
    $('#lvStats').innerHTML = [
      ['','📋','ใบลาทั้งหมด','#b71c1c'],
      ['รออนุมัติ','⏳','รออนุมัติ (' + pendCount + ')','#ef6c00'],
      ['อนุมัติแล้ว','✅','อนุมัติแล้ว','#2e7d32'],
      ['ไม่อนุมัติ','⛔','ไม่อนุมัติ','#c62828']
    ].map(c => `<div class="stat ${LF.status === c[0] || (c[0] === 'รออนุมัติ' && LF.status.indexOf('รออนุมัติ') >= 0) ? 'sel' : ''}" style="border-left-color:${c[3]}" data-s="${c[0]}" onclick="setLF(this.dataset.s)">
      <div class="l">${c[1]} ${c[2]}</div><div class="n" style="color:${c[3]}">${c[0] === 'รออนุมัติ' ? pendCount : (c[0] ? inFy.filter(r => r.status === c[0]).length : inFy.length)}</div></div>`).join('');
  } else {
    const ok = inFy.filter(r => r.status === 'อนุมัติแล้ว');
    const types = LEAVE_MAIN.concat((S.cfg.leaveTypes || []).filter(t => LEAVE_MAIN.indexOf(t) < 0 && ok.some(r => r.leaveType === t)));
    const myPend = inFy.filter(r => (r.status || '').indexOf('รออนุมัติ') >= 0).length;
    $('#lvStats').innerHTML = types.map(t => {
      const a = ok.filter(r => r.leaveType === t);
      const d = a.reduce((s, r) => s + r.days, 0);
      return `<div class="stat ${LF.type === t ? 'sel' : ''}" data-t="${esc(t)}" onclick="setLFType(this.dataset.t)">
        <div class="l">${LV_ICON[t] || '📄'} ${esc(t)}</div><div class="n">${d % 1 ? d.toFixed(1) : d} <small>วัน</small></div><div class="d">${a.length} ครั้ง ${LF.fy ? '· ปีงบฯ ' + LF.fy : ''}</div></div>`;
    }).join('') + `<div class="stat" style="border-left-color:#ef6c00" data-s="รออนุมัติ" onclick="setLF(this.dataset.s)"><div class="l">⏳ รออนุมัติ</div><div class="n" style="color:#ef6c00">${myPend}</div></div>`;
  }

  const q = (LF.q || '').trim().toLowerCase();
  const rows = inFy.filter(r => {
    if (LF.type && r.leaveType !== LF.type) return false;
    if (LF.status) {
      if (LF.status === 'รออนุมัติ') { if ((r.status || '').indexOf('รออนุมัติ') < 0) return false; }
      else if (r.status !== LF.status) return false;
    }
    if (q && ![r.fullName, r.position, r.reason, r.leaveType].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });

  $('#lvBody').innerHTML = rows.length ? rows.map((r, i) => `<tr class="${r.status === 'ยกเลิก' ? 'row-off' : ''}">
    <td>${i + 1}</td>
    <td><b>${esc(r.fullName || '-')}</b>${r.position ? `<div class="sub">${esc(r.position)}</div>` : ''}</td>
    <td class="nowrap">${lvType(r.leaveType)}</td>
    <td class="nowrap">${lvRange(r)}</td>
    <td class="nowrap"><b>${fmtDays(r.days)}</b></td>
    <td><div style="min-width:160px">${esc(r.reason || '-')}</div></td>
    <td>${lvBadge(r.status)}</td>
    <td>${fileLink(r)}</td>
    <td>${leaveActions(r)}</td>
  </tr>`).join('')
  : `<tr><td colspan="9" class="empty">${S.list.length ? 'ไม่พบข้อมูลตามตัวกรอง' : 'ยังไม่มีใบลา กด "+ เขียนใบลา" เพื่อเริ่ม'}</td></tr>`;
  $('#lvCount').textContent = `แสดง ${rows.length} จาก ${inFy.length} รายการ`;

  if ($('#lvSum')) {
    const ok = inFy.filter(r => r.status === 'อนุมัติแล้ว');
    const cols = LEAVE_MAIN.concat('อื่น ๆ');
    const ppl = {};
    ok.forEach(r => {
      const k = r.username || r.fullName;
      if (!ppl[k]) ppl[k] = { name: r.fullName, pos: r.position, t: {}, total: 0 };
      const key = LEAVE_MAIN.indexOf(r.leaveType) >= 0 ? r.leaveType : 'อื่น ๆ';
      const x = ppl[k].t[key] || (ppl[k].t[key] = { n: 0, d: 0 });
      x.n++; x.d += r.days; ppl[k].total += r.days;
    });
    const list = Object.keys(ppl).map(k => ppl[k]).sort((a, b) => b.total - a.total);
    $('#lvSum').innerHTML = list.length ? `<table class="tbl compact"><thead><tr><th>#</th><th>ชื่อ-สกุล</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}<th>รวม</th></tr></thead><tbody>
      ${list.map((p, i) => `<tr><td>${i + 1}</td><td><b>${esc(p.name)}</b>${p.pos ? `<div class="sub">${esc(p.pos)}</div>` : ''}</td>
        ${cols.map(c => `<td class="nowrap">${p.t[c] ? fmtDays(p.t[c].d) + ` <span class="sub">(${p.t[c].n} ครั้ง)</span>` : '-'}</td>`).join('')}
        <td class="nowrap"><b>${fmtDays(p.total)}</b></td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">ยังมีการลาที่อนุมัติแล้วเสร็จสมบูรณ์</div>';
    $('#lvSumFy').textContent = LF.fy ? '(ปีงบประมาณ ' + LF.fy + ')' : '(ทุกปี)';
  }
}

function leaveActions(r){
  const own = r.username === S.user.username, staff = isStaff();
  const isPend = (r.status || '').indexOf('รออนุมัติ') >= 0;
  let h = `<button class="btn btn-sm btn-light" onclick="viewLeave('${r.id}')">ดู</button> `;
  if (staff && isPend) h += `<button class="btn btn-sm btn-ok" onclick="openReview('${r.id}')">พิจารณา</button> `;
  if ((own && isPend) || (staff && r.status !== 'ยกเลิก')) {
    if (isPend) h += `<button class="btn btn-sm btn-light" onclick="openLeaveForm('${r.id}')">แก้ไข</button> `;
    h += `<button class="btn btn-sm btn-light" onclick="cancelLeave('${r.id}')">ยกเลิกใบลา</button> `;
  }
  if (isAdmin()) h += `<button class="btn btn-sm btn-del" onclick="delLeave('${r.id}')">ลบ</button>`;
  return `<div class="nowrap">${h}</div>`;
}

function lvDetailRows(r){
  const leaveSteps = S.cfg.leaveSteps || [];
  const curIdx = Number(r.stepIndex) || 0;
  const isDone = r.status === 'อนุมัติแล้ว' || r.status === 'ไม่อนุมัติ';

  const barHtml = `<div class="steps" style="margin-top:4px">${leaveSteps.slice(0, 4).map((st, i) =>
    `<span class="sdot ${i <= curIdx || isDone && r.status === 'อนุมัติแล้ว' ? 'on' : ''}" style="${i <= curIdx || isDone && r.status === 'อนุมัติแล้ว' ? 'background:' + (r.status === 'ไม่อนุมัติ' && i === curIdx ? '#c62828' : '#2e7d32') : ''}" title="${esc(st)}">${i + 1}</span>`
  ).join('<i class="sline"></i>')}</div>`;

  const logHtml = (r.approversLog || []).map(l => `
    <div class="tl"><div class="tl-dot" style="background:${l.decision === 'อนุมัติ' ? '#2e7d32' : '#c62828'}"></div><div>
      <b>ขั้นที่ ${l.step}: ${esc(l.stepName)}</b> — <span class="badge ${l.decision === 'อนุมัติ' ? 'b-green' : 'b-red'}">${esc(l.decision)}</span>
      <div class="sub">ผู้พิจารณา: ${esc(l.approver)} · ${thDateTime(l.at)}</div>
      ${l.note ? `<div style="margin-top:2px">ความเห็น: ${esc(l.note)}</div>` : ''}
    </div></div>`).join('');

  return [
    ['ผู้ลา', `<b>${esc(r.fullName)}</b>${r.position ? ' · ' + esc(r.position) : ''}`],
    ['กลุ่มงาน', esc(r.groupName)],
    ['ประเภทการลา', lvType(r.leaveType)],
    ['วันที่ลา', lvRange(r)],
    ['จำนวนวัน', `<b>${fmtDays(r.days)}</b>`],
    ['เหตุผล', esc(r.reason)],
    ['ติดต่อระหว่างลา', esc(r.contact)],
    ['ไฟล์แนบ', r.fileUrl ? fileLink(r) : ''],
    ['สถานะปัจจุบัน', lvBadge(r.status) + barHtml],
    ['ประวัติการพิจารณา', logHtml || '<div class="sub">ยังไม่มีประวัติการพิจารณา</div>'],
    ['วันที่ส่งใบลา', r.createdAt ? thDateTime(r.createdAt) : '']
  ].filter(x => x[1] && x[1] !== '-').map(x => `<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('');
}

function viewLeave(id){
  const r = S.list.find(x => x.id === id); if (!r) return;
  openModal('รายละเอียดใบลา', `<table class="tbl detail" style="min-width:0">${lvDetailRows(r)}</table>
    <div class="form-actions"><button class="btn btn-light" onclick="closeModal()">ปิด</button></div>`);
}

function openReview(id){
  const r = S.list.find(x => x.id === id); if (!r) return;
  const leaveSteps = S.cfg.leaveSteps || [];
  const idx = Number(r.stepIndex) || 0;
  const stepNames = ['หัวหน้างาน', 'หัวหน้างานการลา', 'รอง ผอ.กลุ่มบริหารงานบุคคล', 'ผู้อำนวยการโรงเรียน'];
  const curName = stepNames[idx] || ('ขั้นที่ ' + (idx + 1));

  openModal('พิจารณาใบลา (' + curName + ')', `
    <table class="tbl detail" style="min-width:0">${lvDetailRows(r)}</table>
    <div class="form-grid" style="margin-top:14px">
      <div class="full"><label>ความเห็น / เงื่อนไขเพิ่มเติม (กรณีไม่อนุมัติต้องระบุเหตุผล)</label><textarea class="input" id="rvNote" rows="2" placeholder="ความเห็นประกอบการพิจารณา..."></textarea></div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-light" onclick="closeModal()">ปิด</button>
      <button type="button" class="btn btn-del" id="rvNo">ไม่อนุมัติ</button>
      <button type="button" class="btn btn-ok" id="rvYes">✓ อนุมัติ / ผ่านขั้นนี้ ➜</button>
    </div>`);
  const act = async dec => {
    const note = $('#rvNote').value;
    if (dec === 'ไม่อนุมัติ' && !note.trim()) return toast('กรุณาระบุเหตุผลที่ไม่อนุมัติ', 'err');
    try {
      await call('reviewLeave', S.token, id, dec, note);
      closeModal(); toast('บันทึกผลการพิจารณาเรียบร้อย', 'ok'); loadLeave();
    } catch (e) {}
  };
  $('#rvYes').onclick = () => act('อนุมัติ');
  $('#rvNo').onclick = () => act('ไม่อนุมัติ');
}

function openLeaveForm(id){
  const d = id ? S.list.find(x => x.id === id) : null;
  const t = today();
  const r = d || { fullName: S.user.fullName, position: S.user.position || '', leaveType: 'ลาป่วย', period: 'เต็มวัน', startDate: t, endDate: t };
  const staff = isStaff();
  openModal(d ? 'แก้ไขใบลา' : 'เขียนใบลา', `
  <form id="lvForm"><div class="form-grid">
    <div><label>ชื่อ-สกุล ผู้ลา</label><input class="input" name="fullName" value="${esc(r.fullName || '')}" ${staff ? '' : 'readonly'}></div>
    <div><label>ตำแหน่ง</label><input class="input" name="position" value="${esc(r.position || '')}" placeholder="เช่น ครู คศ.1"></div>
    <div><label>ประเภทการลา <span class="req">*</span></label><select class="input" name="leaveType" id="lvType">${opts(S.cfg.leaveTypes, r.leaveType)}</select></div>
    <div><label>ช่วงเวลา</label><select class="input" name="period" id="lvPeriod">${opts(S.cfg.leavePeriods, r.period || 'เต็มวัน')}</select></div>
    <div><label>ตั้งแต่วันที่ <span class="req">*</span></label><input type="date" class="input" id="lvStart" value="${esc(r.startDate || '')}" required></div>
    <div><label>ถึงวันที่ <span class="req">*</span></label><input type="date" class="input" id="lvEnd" value="${esc(r.endDate || '')}" required></div>
    <div class="full"><div class="lv-calc" id="lvCalc"></div></div>
    <div class="full"><label>เหตุผลการลา <span class="req" id="lvReq">*</span></label><textarea class="input" name="reason" rows="2">${esc(r.reason || '')}</textarea></div>
    <div class="full"><label>ระหว่างลาติดต่อได้ที่</label><input class="input" name="contact" value="${esc(r.contact || '')}" placeholder="ที่อยู่ / เบอร์โทรศัพท์"></div>
    <div class="full"><label>ไฟล์แนบ (ใบรับรองแพทย์ / เอกสารประกอบ)</label>
      <input type="file" class="input" id="lvFile">
      ${r.fileUrl ? `<div class="sub" style="margin-top:6px">ไฟล์ปัจจุบัน: <a class="link" href="${esc(r.fileUrl)}" target="_blank">${esc(r.fileName || 'เปิดไฟล์')}</a></div>` : ''}</div>
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-light" onclick="closeModal()">ยกเลิก</button>
    <button type="submit" class="btn btn-pri">${d ? 'บันทึก' : 'ส่งใบลา'}</button>
  </div></form>`);

  const upd = () => {
    const per = $('#lvPeriod').value, ty = $('#lvType').value;
    if (per !== 'เต็มวัน') { $('#lvEnd').value = $('#lvStart').value; $('#lvEnd'].disabled = true; }
    else $('#lvEnd'].disabled = false;
    const c = calcLeave($('#lvStart').value, $('#lvEnd').value, per, ty);
    let h = c.err ? `<span style="color:#c62828">⚠ ${esc(c.err)}</span>`
      : `จำนวนวันลา: <b>${fmtDays(c.days)}</b> <span class="sub">${LEAVE_CAL.indexOf(ty) >= 0 ? '(นับรวมวันหยุด)' : '(ไม่นับเสาร์-อาทิตย์ · วันหยุดนักขัตฤกษ์โปรดตรวจสอบ)'}</span>`;
    if (ty === 'ลาป่วย' && c.days >= 30) h += '<div class="sub" style="color:#e65100;margin-top:4px">ลาป่วยตั้งแต่ 30 วันขึ้นไป ต้องแนบใบรับรองแพทย์</div>';
    $('#lvCalc').innerHTML = h;
    $('#lvReq').classList.toggle('hidden', ty === 'ลาพักผ่อน');
  };
  ['#lvType', '#lvPeriod', '#lvStart', '#lvEnd'].forEach(s => $(s).addEventListener('change', upd));
  upd();

  $('#lvForm').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const data = {
      fullName: fd.get('fullName') || '', position: fd.get('position') || '',
      leaveType: fd.get('leaveType'), period: fd.get('period'),
      startDate: $('#lvStart').value, endDate: $('#lvEnd').value,
      reason: fd.get('reason') || '', contact: fd.get('contact') || ''
    };
    const c = calcLeave(data.startDate, data.endDate, data.period, data.leaveType);
    if (c.err) return toast(c.err, 'err');
    if (data.leaveType !== 'ลาพักผ่อน' && !data.reason.trim()) return toast('กรุณาระบุเหตุผลการลา', 'err');
    if (d) data.id = d.id;
    let file;
    try { file = await readFile($('#lvFile')); } catch (e) { return toast(e.message, 'err'); }
    try {
      await call('saveLeave', S.token, data, file);
      closeModal();
      toast(d ? 'บันทึกการแก้ไขเรียบร้อย' : 'ส่งใบลาเรียบร้อย (เริ่มขั้นตอนที่ 1)', 'ok');
      loadLeave();
    } catch (e) {}
  };
}

async function cancelLeave(id){
  if (!(await confirmBox('ยกเลิกใบลา', 'ต้องการยกเลิกใบลานี้ใช่หรือไม่?', 'ยกเลิกใบลา', true, '🗓️'))) return;
  try { await call('cancelLeave', S.token, id); toast('ยกเลิกใบลาเรียบร้อย', 'ok'); loadLeave(); } catch (e) {}
}

async function delLeave(id){
  if (!(await confirmBox('ยืนยันการลบ', 'ลบใบลานี้ออกจากระบบถาวร?', 'ลบ', true, '🗑️', 'ไฟล์แนบจะถูกย้ายไปถังขยะ'))) return;
  try { await call('deleteLeave', S.token, id); toast('ลบเรียบร้อย', 'ok'); loadLeave(); } catch (e) {}
}

function studySteps(){ return (S.cfg && S.cfg.studySteps) || []; }
function studyCourse(r){ return [r.degree, r.major ? 'สาขา' + r.major : ''].filter(Boolean).join(' ') || r.subject || '-'; }
function stepColor(i){ return STEP_COLORS[i] || '#777'; }
function stepBadge(i){
  const s = studySteps()[i] || '-';
  const c = stepColor(i);
  const done = i === studySteps().length - 1;
  return `<span class="badge" style="background:${c}1f;color:${c}">${esc(s)}${done ? ' ✓' : ''}</span>`;
}
function stepBar(idx){
  return `<div class="steps">${studySteps().map((s, i) =>
    `<span class="sdot ${i <= idx ? 'on' : ''}" style="${i <= idx ? 'background:' + stepColor(idx) : ''}" title="${esc(s)}">${i + 1}</span>`
  ).join('<i class="sline"></i>')}</div>`;
}

function renderStudy(){
  S.type = 'study'; S.list = [];
  mainEl().innerHTML = `
  <div class="head-row">
    <h2 class="page-title" style="margin:0">ทะเบียนการลาศึกษาต่อ</h2>
    <button class="btn btn-pri" onclick="openStudyForm()">+ ยื่นคำขอลาศึกษาต่อ</button>
  </div>
  <div class="stats" id="stStats"></div>
  <div class="card">
    <div class="toolbar">
      <input id="sq" class="input grow" placeholder="ค้นหาชื่อ / สาขา / สถานศึกษา" value="${esc(SF.q)}">
      <select id="ss" class="input"><option value="">ทุกขั้นตอน</option>${studySteps().map((s, i) => `<option value="${i}" ${String(i) === SF.step ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    </div>
    <div class="table-wrap"><table class="tbl"><thead><tr>
      <th>#</th><th>ผู้ขอ</th><th>หลักสูตร / สถานศึกษา</th><th>ขั้นตอนปัจจุบัน</th><th>อัปเดตล่าสุด</th><th>ไฟล์ล่าสุด</th><th>จัดการ</th>
    </tr></thead><tbody id="stBody"><tr><td colspan="7" class="empty">กำลังโหลด...</td></tr></tbody></table></div>
    <div class="footer-info" id="stCount"></div>
  </div>`;
  $('#sq').oninput = e => { SF.q = e.target.value; drawStudy(); };
  $('#ss').onchange = e => { SF.step = e.target.value; drawStudy(); };
  loadStudy();
}

async function loadStudy(){
  try {
    const list = await api('listStudy', S.token);
    if (S.page !== 'study') return;
    S.list = list || [];
    drawStudy();
  } catch (e) {
    handleErr(e);
    if ($('#stBody')) $('#stBody').innerHTML = `<tr><td colspan="7" class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc((e && e.message) || e)}</td></tr>`;
  }
}

function setSF(v){ SF.step = v; if ($('#ss')) $('#ss').value = v; drawStudy(); }

function drawStudy(){
  if (!$('#stBody')) return;
  const steps = studySteps();
  $('#stStats').innerHTML =
    `<div class="stat ${SF.step === '' ? 'sel' : ''}" onclick="setSF('')"><div class="l">🎓 ทั้งหมด</div><div class="n">${S.list.length}</div></div>` +
    steps.map((s, i) => `<div class="stat ${SF.step === String(i) ? 'sel' : ''}" style="border-left-color:${stepColor(i)}" onclick="setSF('${i}')">
      <div class="l">${esc(s)}</div><div class="n" style="color:${stepColor(i)}">${S.list.filter(r => r.stepIdx === i).length}</div></div>`).join('');

  const q = (SF.q || '').trim().toLowerCase();
  const rows = S.list.filter(r =>
    (SF.step === '' || String(r.stepIdx) === SF.step) &&
    (!q || [r.fullName, r.position, r.degree, r.major, r.university, r.subject, r.note].join(' ').toLowerCase().includes(q)));

  $('#stBody').innerHTML = rows.length ? rows.map((r, i) => `<tr>
    <td>${i + 1}</td>
    <td><b>${esc(r.fullName || '-')}</b>${r.position ? `<div class="sub">${esc(r.position)}</div>` : ''}</td>
    <td><div class="subject">${esc(studyCourse(r))}</div>${r.university ? `<div class="sub">${esc(r.university)}</div>` : ''}</td>
    <td>${stepBar(r.stepIdx)}<div style="margin-top:6px">${stepBadge(r.stepIdx)}</div></td>
    <td class="nowrap">${thDateTime(r.updatedAt || r.createdAt)}</td>
    <td>${fileLink(r)}</td>
    <td>${studyActions(r)}</td>
  </tr>`).join('')
  : `<tr><td colspan="7" class="empty">${S.list.length ? 'ไม่พบข้อมูลตามตัวกรอง' : 'ยังไม่มีข้อมูลการลาศึกษาต่อ กด "+ ยื่นคำขอลาศึกษาต่อ" เพื่อเริ่ม'}</td></tr>`;
  $('#stCount').textContent = `แสดง ${rows.length} จาก ${S.list.length} รายการ`;
}

function studyActions(r){
  const staff = isStaff(), own = r.createdBy === S.user.username;
  const last = studySteps().length - 1;
  let h = `<button class="btn btn-sm btn-light" onclick="viewStudy('${r.id}')">ดู</button> `;
  if (staff || own) {
    if (r.stepIdx < last) h += `<button class="btn btn-sm btn-ok" onclick="openAdvance('${r.id}',1)">ขั้นถัดไป ➜</button> `;
    if (staff && r.stepIdx > 0) h += `<button class="btn btn-sm btn-light" onclick="openAdvance('${r.id}',-1)">↩ ย้อนขั้น</button> `;
    h += `<button class="btn btn-sm btn-light" onclick="openStudyForm('${r.id}')">แก้ไข</button> `;
    if (staff || r.stepIdx === 0) h += `<button class="btn btn-sm btn-del" onclick="delStudy('${r.id}')">ลบ</button>`;
  }
  return `<div class="nowrap">${h}</div>`;
}

function openStudyForm(id){
  const d = id ? S.list.find(x => x.id === id) : null;
  const r = d || { fullName: S.user.fullName, position: S.user.position || '', docDate: today() };
  const degrees = (!r.degree || DEGREES.indexOf(r.degree) >= 0) ? DEGREES : DEGREES.concat(r.degree);
  openModal(d ? 'แก้ไขข้อมูลการลาศึกษาต่อ' : 'ยื่นคำขอลาศึกษาต่อ (ขั้นที่ 1: ขออนุญาตไปสมัครสอบ)', `
  <form id="stForm"><div class="form-grid">
    <div><label>ชื่อ-สกุล ผู้ขอ <span class="req">*</span></label><input class="input" name="fullName" required value="${esc(r.fullName || '')}"></div>
    <div><label>ตำแหน่ง / วิทยฐานะ</label><input class="input" name="position" value="${esc(r.position || '')}" placeholder="เช่น ครู คศ.1"></div>
    <div><label>ระดับการศึกษา <span class="req">*</span></label><select class="input" name="degree" required><option value="">- เลือก -</option>${opts(degrees, r.degree)}</select></div>
    <div><label>สาขาวิชา</label><input class="input" name="major" value="${esc(r.major || '')}" placeholder="เช่น การบริหารการศึกษา"></div>
    <div class="full"><label>สถานศึกษา / มหาวิทยาลัย <span class="req">*</span></label><input class="input" name="university" required value="${esc(r.university || '')}"></div>
    <div><label>เลขที่หนังสือ / บันทึกข้อความ</label><input class="input" name="docNo" value="${esc(r.docNo || '')}"></div>
    <div><label>วันที่ยื่น</label><input type="date" class="input" name="docDate" value="${esc(r.docDate || '')}"></div>
    ${d ? `
    <div><label>วันเริ่มลา</label><input type="date" class="input" name="startDate" value="${esc(r.startDate || '')}"></div>
    <div><label>วันสิ้นสุดการลา</label><input type="date" class="input" name="endDate" value="${esc(r.endDate || '')}"></div>
    <div><label>วันที่สำเร็จการศึกษา</label><input type="date" class="input" name="gradDate" value="${esc(r.gradDate || '')}"></div>
    <div></div>` : ''}
    <div class="full"><label>ไฟล์แนบ ${d ? '(อัปโหลดเพื่อแทนไฟล์ล่าสุด)' : ''}</label>
      <input type="file" class="input" id="stFile">
      <div class="sub">${d ? '' : esc(STEP_HINTS[0])}</div>
      ${r.fileUrl ? `<div class="sub" style="margin-top:6px">ไฟล์ล่าสุด: <a class="link" href="${esc(r.fileUrl)}" target="_blank">${esc(r.fileName || 'เปิดไฟล์')}</a></div>` : ''}</div>
    <div class="full"><label>หมายเหตุ</label><textarea class="input" name="note" rows="2">${esc(r.note || '')}</textarea></div>
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-light" onclick="closeModal()">ยกเลิก</button>
    <button type="submit" class="btn btn-pri">${d ? 'บันทึก' : 'ยื่นคำขอ'}</button>
  </div></form>`);
  $('#stForm').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const data = {};
    ['fullName','position','degree','major','university','docNo','docDate','startDate','endDate','gradDate','note']
      .forEach(k => { if (fd.has(k)) data[k] = fd.get(k) || ''; });
    if (d) data.id = d.id;
    let file;
    try { file = await readFile($('#stFile')); } catch (e) { return toast(e.message, 'err'); }
    try {
      await call('saveStudy', S.token, data, file);
      closeModal();
      toast(d ? 'บันทึกการแก้ไขเรียบร้อย' : 'ยื่นคำขอเรียบร้อย (ขั้นที่ 1)', 'ok');
      loadStudy();
    } catch (e) {}
  };
}

function openAdvance(id, dir){
  const r = S.list.find(x => x.id === id); if (!r) return;
  const nx = r.stepIdx + dir;
  if (nx < 0 || nx >= studySteps().length) return;
  let extra = '';
  if (dir === 1 && nx === 1) extra = `
    <div><label>วันเริ่มลา</label><input type="date" class="input" name="startDate" value="${esc(r.startDate || '')}"></div>
    <div><label>วันสิ้นสุดการลา</label><input type="date" class="input" name="endDate" value="${esc(r.endDate || '')}"></div>`;
  if (dir === 1 && nx === 2) extra = `
    <div><label>วันที่สำเร็จการศึกษา <span class="req">*</span></label><input type="date" class="input" name="gradDate" required value="${esc(r.gradDate || '')}"></div><div></div>`;
  if (dir === 1 && nx === 3) extra = `
    <div class="full"><label>เลขที่หนังสือรายงานการเพิ่มวุฒิ</label><input class="input" name="docNo" value=""></div>`;

  openModal(dir === 1 ? 'เลื่อนไปขั้นตอนถัดไป' : 'ย้อนขั้นตอน', `
  <div class="sub" style="margin-bottom:10px"><b>${esc(r.fullName)}</b> · ${esc(studyCourse(r))}${r.university ? ' · ' + esc(r.university) : ''}</div>
  <div class="flow">${stepBadge(r.stepIdx)}<span>➜</span>${stepBadge(nx)}</div>
  <form id="advForm"><div class="form-grid">
    <div><label>วันที่</label><input type="date" class="input" name="date" value="${today()}"></div><div></div>
    ${extra}
    ${dir === 1 ? `<div class="full"><label>ไฟล์แนบ</label><input type="file" class="input" id="advFile"><div class="sub">${esc(STEP_HINTS[nx] || '')}</div></div>` : ''}
    <div class="full"><label>${dir === 1 ? 'หมายเหตุ / รายละเอียด' : 'เหตุผลที่ย้อนขั้นตอน'} ${dir === -1 ? '<span class="req">*</span>' : ''}</label>
      <textarea class="input" name="note" rows="2" ${dir === -1 ? 'required' : ''}></textarea></div>
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-light" onclick="closeModal()">ยกเลิก</button>
    <button type="submit" class="btn ${dir === 1 ? 'btn-ok' : 'btn-pri'}">${dir === 1 ? 'ยืนยันเลื่อนขั้น' : 'ยืนยันย้อนขั้น'}</button>
  </div></form>`);

  $('#advForm').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const p = { dir: dir };
    ['date','note','startDate','endDate','gradDate','docNo'].forEach(k => { if (fd.has(k)) p[k] = fd.get(k) || ''; });
    let file = null;
    if (dir === 1) { try { file = await readFile($('#advFile')); } catch (e) { return toast(e.message, 'err'); } }
    try {
      const res = await call('advanceStudy', S.token, id, p, file);
      closeModal();
      toast((dir === 1 ? 'เลื่อนเป็น ' : 'ย้อนเป็น ') + res.step + ' เรียบร้อย', 'ok');
      loadStudy();
    } catch (e) {}
  };
}

function viewStudy(id){
  const r = S.list.find(x => x.id === id); if (!r) return;
  const steps = studySteps();
  const leave = (r.startDate || r.endDate) ? thDate(r.startDate) + ' ถึง ' + thDate(r.endDate) : '';
  const rows = [
    ['ชื่อ-สกุล ผู้ขอ', esc(r.fullName)], ['ตำแหน่ง', esc(r.position)],
    ['ระดับการศึกษา', esc(r.degree)], ['สาขาวิชา', esc(r.major)], ['สถานศึกษา', esc(r.university)],
    ['ขั้นตอนปัจจุบัน', stepBar(r.stepIdx) + '<div style="margin-top:6px">' + stepBadge(r.stepIdx) + '</div>'],
    ['เลขที่หนังสือ', esc(r.docNo)], ['วันที่ยื่น', r.docDate ? thDate(r.docDate) : ''],
    ['ช่วงเวลาลาศึกษา', leave], ['วันที่สำเร็จการศึกษา', r.gradDate ? thDate(r.gradDate) : ''],
    ['ไฟล์ล่าสุด', r.fileUrl ? fileLink(r) : ''], ['หมายเหตุ', esc(r.note)],
    ['ผู้บันทึก', esc(r.createdBy)], ['วันที่บันทึก', r.createdAt ? thDateTime(r.createdAt) : ''],
    ['แก้ไขล่าสุด', r.updatedAt ? thDateTime(r.updatedAt) : '']
  ];
  const tl = (r.history || []).map(h => {
    const i = Math.max(0, (Number(h.step) || 1) - 1);
    return `<div class="tl"><div class="tl-dot" style="background:${stepColor(i)}"></div><div>
      <b>${esc(steps[i] || '')}</b> <span class="sub">· ${thDate(h.date)}${h.by ? ' · ' + esc(h.by) : ''}</span>
      ${h.note ? `<div style="margin-top:2px">${esc(h.note)}</div>` : ''}
      ${h.fileUrl ? `<div><a class="link" href="${esc(h.fileUrl)}" target="_blank" rel="noopener">📎 ${esc(h.fileName || 'เปิดไฟล์')}</a></div>` : ''}
    </div></div>`;
  }).join('');
  openModal('รายละเอียดการลาศึกษาต่อ', `
    <table class="tbl detail" style="min-width:0">${rows.filter(x => x[1] && x[1] !== '-').map(x => `<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')}</table>
    <h3 style="margin:18px 0 6px;font-size:16px">ประวัติขั้นตอน</h3>
    <div>${tl || '<div class="sub">ยังไม่มีประวัติ</div>'}</div>
    <div class="form-actions"><button class="btn btn-light" onclick="closeModal()">ปิด</button></div>`);
}

async function delStudy(id){
  if (!(await confirmBox('ยืนยันการลบ', 'ยืนยันการลบรายการลาศึกษาต่อนี้?', 'ลบ', true, '🗑️', 'ไฟล์แนบทุกขั้นตอนจะถูกย้ายไปถังขยะ'))) return;
  try { await call('deleteStudy', S.token, id); toast('ลบเรียบร้อย', 'ok'); loadStudy(); } catch (e) {}
}

function renderUsers(){
  S.type = 'users'; S.list = [];
  mainEl().innerHTML = `
  <div class="head-row">
    <h2 class="page-title" style="margin:0">จัดการผู้ใช้งาน</h2>
    <button class="btn btn-pri" onclick="openUserForm()">+ เพิ่มผู้ใช้งาน</button>
  </div>
  <div class="stats" id="usStats"></div>
  <div class="card">
    <div class="toolbar">
      <input id="uq" class="input grow" placeholder="ค้นหาชื่อผู้ใช้ / ชื่อ-สกุล / ตำแหน่ง / กลุ่มงาน" value="${esc(UF.q)}">
      <select id="ur" class="input"><option value="">ทุกกลุ่มผู้ใช้</option>${Object.keys(S.cfg.roles).map(k => `<option value="${k}" ${UF.role === k ? 'selected' : ''}>${esc(S.cfg.roles[k])}</option>`).join('')}</select>
    </div>
    <div class="table-wrap"><table class="tbl"><thead><tr>
      <th>#</th><th>ชื่อ-สกุล</th><th>ชื่อผู้ใช้</th><th>ตำแหน่ง</th><th>กลุ่มงาน</th><th>กลุ่มผู้ใช้ (สิทธิ์)</th><th>สถานะ</th><th>จัดการ</th>
    </tr></thead><tbody id="usBody"><tr><td colspan="8" class="empty">กำลังโหลด...</td></tr></tbody></table></div>
    <div class="footer-info" id="usCount"></div>
  </div>`;
  $('#uq').oninput = e => { UF.q = e.target.value; drawUsers(); };
  $('#ur').onchange = e => { UF.role = e.target.value; drawUsers(); };
  loadUsers();
}

async function loadUsers(){
  try {
    const list = await api('listUsers', S.token);
    if (S.page !== 'users') return;
    S.list = list || [];
    drawUsers();
  } catch (e) { handleErr(e); }
}

function setUF(role){ UF.role = UF.role === role ? '' : role; if ($('#ur')) $('#ur').value = UF.role; drawUsers(); }

function drawUsers(){
  if (!$('#usBody')) return;
  $('#usStats').innerHTML = Object.keys(S.cfg.roles).map(k => `
    <div class="stat ${UF.role === k ? 'sel' : ''}" style="border-left-color:${ROLE_COLOR[k]}" onclick="setUF('${k}')">
      <div class="l">${ROLE_ICON[k]} ${esc(S.cfg.roles[k])}</div>
      <div class="n" style="color:${ROLE_COLOR[k]}">${S.list.filter(u => u.role === k).length} <small>คน</small></div>
      <div class="d">${esc(ROLE_DESC[k])}</div>
    </div>`).join('');
  const q = (UF.q || '').trim().toLowerCase();
  const rows = S.list.filter(u => (!UF.role || u.role === UF.role) &&
    (!q || [u.username, u.fullName, u.position, u.groupName].join(' ').toLowerCase().includes(q)));
  $('#usBody').innerHTML = rows.length ? rows.map((u, i) => `<tr class="${u.active === 'ปิดใช้งาน' ? 'row-off' : ''}">
    <td>${i + 1}</td>
    <td><b>${esc(u.fullName || '-')}</b>${u.username === S.user.username ? ' <span class="badge b-purple">คุณ</span>' : ''}</td>
    <td class="nowrap">${esc(u.username)}</td>
    <td>${esc(u.position || '-')}</td>
    <td>${esc(u.groupName || '-')}</td>
    <td>${roleBadge(u.role)}</td>
    <td>${u.active === 'ปิดใช้งาน' ? '<span class="badge b-gray">ปิดใช้งาน</span>' : '<span class="badge b-green">ใช้งาน</span>'}</td>
    <td class="nowrap"><button class="btn btn-sm btn-light" data-u="${esc(u.username)}" onclick="openUserForm(this.dataset.u)">แก้ไข</button>
      ${u.username !== S.user.username ? `<button class="btn btn-sm btn-del" data-u="${esc(u.username)}" onclick="delUser(this.dataset.u)">ลบ</button>` : ''}</td>
  </tr>`).join('') : `<tr><td colspan="8" class="empty">ไม่พบผู้ใช้งาน</td></tr>`;
  $('#usCount').textContent = `แสดง ${rows.length} จาก ${S.list.length} คน`;
}

function openUserForm(username){
  const d = username ? S.list.find(x => x.username === username) : null;
  const r = d || { role: 'user', active: 'ใช้งาน', groupName: '' };
  const groups = (S.cfg.groups || []).slice();
  if (r.groupName && groups.indexOf(r.groupName) < 0) groups.push(r.groupName);
  openModal(d ? 'แก้ไขผู้ใช้งาน' : 'เพิ่มผู้ใช้งาน', `
  <form id="usForm"><div class="form-grid">
    <div><label>ชื่อผู้ใช้ (ภาษาอังกฤษ) <span class="req">*</span></label><input class="input" name="username" value="${esc(r.username || '')}" ${d ? 'readonly' : 'required'} placeholder="เช่น somchai.j"></div>
    <div><label>รหัสผ่าน ${d ? '' : '<span class="req">*</span>'}</label><input type="password" class="input" name="password" ${d ? '' : 'required'} minlength="4" placeholder="${d ? 'เว้นว่าง = ไม่เปลี่ยน' : 'อย่างน้อย 4 ตัวอักษร'}" autocomplete="new-password"></div>
    <div><label>ชื่อ-สกุล <span class="req">*</span></label><input class="input" name="fullName" required value="${esc(r.fullName || '')}" placeholder="เช่น นายสมชาย ใจดี"></div>
    <div><label>ตำแหน่ง</label><input class="input" name="position" value="${esc(r.position || '')}" placeholder="เช่น ครู คศ.2"></div>
    <div><label>กลุ่มงาน</label><select class="input" name="groupName"><option value="">- ไม่ระบุ -</option>${opts(groups, r.groupName)}</select></div>
    <div><label>สถานะบัญชี</label><select class="input" name="active">${opts(['ใช้งาน', 'ปิดใช้งาน'], r.active)}</select></div>
    <div class="full"><label>กลุ่มผู้ใช้ (สิทธิ์) <span class="req">*</span></label>
      <select class="input" name="role" id="ufRole">${Object.keys(S.cfg.roles).map(k => `<option value="${k}" ${r.role === k ? 'selected' : ''}>${ROLE_ICON[k]} ${esc(S.cfg.roles[k])}</option>`).join('')}</select>
      <div class="role-desc" id="ufDesc"></div></div>
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-light" onclick="closeModal()">ยกเลิก</button>
    <button type="submit" class="btn btn-pri">บันทึก</button>
  </div></form>`);
  const desc = () => { $('#ufDesc').textContent = ROLE_DESC[$('#ufRole'].value] || ''; };
  $('#ufRole').onchange = desc; desc();
  $('#usForm').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const data = {};
    ['username','password','fullName','position','groupName','active','role'].forEach(k => data[k] = fd.get(k) || '');
    data.isNew = !d;
    try {
      await call('saveUser', S.token, data);
      closeModal(); toast(d ? 'บันทึกการแก้ไขเรียบร้อย' : 'เพิ่มผู้ใช้งานเรียบร้อย', 'ok'); loadUsers();
    } catch (e) {}
  };
}

async function delUser(username){
  const u = S.list.find(x => x.username === username);
  if (!(await confirmBox('ยืนยันการลบผู้ใช้', 'ลบผู้ใช้ "' + (u ? u.fullName : username) + '" ?', 'ลบ', true, '🗑️', 'หากต้องการเก็บประวัติไว้ แนะนำให้ "ปิดใช้งาน" แทนการลบ'))) return;
  try { await call('deleteUser', S.token, username); toast('ลบผู้ใช้เรียบร้อย', 'ok'); loadUsers(); } catch (e) {}
}

function renderSend(){
  S.type = 'mine'; S.list = [];
  const u = S.user;
  mainEl().innerHTML = `
  <h2 class="page-title">ส่งหนังสือถึงกลุ่มงานบุคคล</h2>
  <div class="card" style="margin-bottom:16px">
    <h3>📨 แบบฟอร์มส่งหนังสือ ถึง ${esc(S.cfg.app.targetGroup)}</h3>
    <form id="sendForm"><div class="form-grid">
      <div><label>เลขที่หนังสือ</label><input class="input" name="docNo" placeholder="ถ้ามี"></div>
      <div><label>ลงวันที่</label><input type="date" class="input" name="docDate" value="${today()}"></div>
      <div><label>จาก (ผู้ส่ง/หน่วยงาน) <span class="req">*</span></label>
        <input class="input" name="fromOrg" required value="${esc(u.fullName + (u.groupName ? ' (' + u.groupName + ')' : ''))}"></div>
      <div><label>ชั้นความเร็ว</label><select class="input" name="speed">${opts(S.cfg.speeds, 'ปกติ')}</select></div>
      <div class="full"><label>เรื่อง <span class="req">*</span></label><textarea class="input" name="subject" rows="2" required></textarea></div>
      <div class="full"><label>ไฟล์แนบ (ไม่เกิน ${S.cfg.app.maxFileMb} MB)</label><input type="file" class="input" id="sFile"></div>
      <div class="full"><label>หมายเหตุ / ข้อความถึงกลุ่มงาน</label><textarea class="input" name="note" rows="2"></textarea></div>
    </div>
    <div class="form-actions">
      <button type="reset" class="btn btn-light">ล้างข้อมูล</button>
      <button type="submit" class="btn btn-pri">ส่งหนังสือ</button>
    </div></form>
  </div>
  <div class="card">
    <h3>ประวัติการส่งหนังสือ${isStaff() ? ' (ทั้งหมด)' : 'ของฉัน'}</h3>
    <div class="table-wrap"><table class="tbl"><thead><tr>
      <th>#</th><th>วันที่ส่ง</th><th>เลขที่หนังสือ</th><th>จาก</th><th>เรื่อง</th><th>ชั้นความเร็ว</th><th>สถานะ</th><th>เลขรับ</th><th>ไฟล์แนบ</th><th>จัดการ</th>
    </tr></thead><tbody id="sendBody"><tr><td colspan="10" class="empty">กำลังโหลด...</td></tr></tbody></table></div>
  </div>`;

  $('#sendForm').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const data = {};
    ['docNo','docDate','fromOrg','speed','subject','note'].forEach(k => data[k] = fd.get(k) || '');
    let file;
    try { file = await readFile($('#sFile')); } catch (e) { return toast(e.message, 'err'); }
    try {
      await call('submitToGroup', S.token, data, file);
      ev.target.reset();
      ev.target.querySelector('[name=docDate]').value = today();
      ev.target.querySelector('[name=fromOrg]').value = u.fullName + (u.groupName ? ' (' + u.groupName + ')' : '');
      toast('ส่งหนังสือเรียบร้อย (สถานะ: รอลงรับ)', 'ok');
      reloadPage();
    } catch (e) {}
  };
  loadMine();
}

async function loadMine(){
  try {
    const list = await api('mySubmissions', S.token);
    if (S.page !== 'send') return;
    S.list = list;
    $('#sendBody').innerHTML = list.length ? list.map((r, i) => `<tr>
      <td>${i + 1}</td><td class="nowrap">${thDateTime(r.createdAt)}</td><td class="nowrap">${esc(r.docNo || '-')}</td>
      <td>${esc(r.fromOrg || '-')}</td><td><div class="subject">${esc(r.subject)}</div></td>
      <td>${speedBadge(r.speed)}</td><td>${statusBadge(r.status)}</td><td class="nowrap">${esc(r.regNo || '-')}</td>
      <td>${fileLink(r)}</td>
      <td class="nowrap"><button class="btn btn-sm btn-light" onclick="viewDoc('${r.id}')">ดู</button>
        ${isStaff() && r.status === 'รอลงรับ' ? `<button class="btn btn-sm btn-ok" onclick="receiveDoc('${r.id}')">ลงรับ</button>` : ''}</td>
    </tr>`).join('') : `<tr><td colspan="10" class="empty">ไม่พบข้อมูล</td></tr>`;
  } catch (e) { handleErr(e); }
}
</script>
</body>
</html>
