<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#b71c1c;--pri2:#d32f2f;--pri-soft:#fde8e8;--bg:#fdf5f5;--card:#fff;--side:#fff;--text:#2d2d2d;--muted:#777;--line:#f1dddd;--thead:#fbf0f0;--input:#fff}
body.dark{--bg:#121418;--card:#1c1f26;--side:#181b21;--text:#e9e9e9;--muted:#9aa0a6;--line:#2c313a;--thead:#232831;--input:#14171c;--pri-soft:#3a1d1f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Sarabun',sans-serif;font-size:15px;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
.topbar{position:fixed;top:0;left:0;right:0;height:68px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:3px solid #ef9a9a;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #ffcdd2;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.brand h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap}
.brand small{display:block;font-size:12.5px;opacity:.95}
.top-right{display:flex;align-items:center;gap:10px;font-size:14px}
.user-label{font-weight:600;white-space:nowrap}
.role-tag{background:rgba(255,255,255,.22);border-radius:20px;padding:1px 9px;font-size:12px;margin-left:6px;font-weight:500}
.btn-top{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:7px 12px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.btn-top:hover{background:rgba(255,255,255,.3)}
.hamburger{display:none}
.sidebar{position:fixed;top:68px;left:0;bottom:0;width:230px;background:var(--side);border-right:1px solid var(--line);padding:14px 8px;overflow-y:auto;z-index:15}
.nav-sec{font-size:12.5px;color:var(--muted);padding:12px 12px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--text);margin:2px 0;user-select:none}
.nav-item:hover{background:var(--pri-soft)}
.nav-item.active{background:var(--pri);color:#fff;font-weight:600}
.nav-badge{margin-left:auto;background:#ef6c00;color:#fff;border-radius:20px;font-size:12px;padding:1px 8px;font-weight:700}
.nav-item.active .nav-badge{background:#fff;color:var(--pri)}
.main{margin-left:230px;padding:88px 22px 30px}
.page-title{font-size:20px;font-weight:700;margin:4px 0 16px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 12px;font-size:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.input{height:42px;border:1px solid var(--line);border-radius:6px;padding:0 12px;font-family:inherit;font-size:15px;background:var(--input);color:var(--text);outline:none}
.input:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(211,47,47,.12)}
.input[readonly],.input:disabled{opacity:.7}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
input[type=file].input{padding-top:8px}
.grow{flex:1;min-width:200px}
.btn{height:42px;border:0;border-radius:6px;padding:0 16px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:#9a1515}
.btn-light{background:var(--thead);color:var(--text);border:1px solid var(--line)}
.btn-sm{height:30px;padding:0 10px;font-size:13px;font-weight:600;border-radius:5px}
.btn-ok{background:#2e7d32;color:#fff}
.btn-info{background:#1565c0;color:#fff}
.btn-del{background:#fff0f0;color:#c62828;border:1px solid #f5c2c2}
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:1000px}
.tbl.compact{min-width:700px}
.tbl th{background:var(--thead);color:var(--muted);font-weight:500;text-align:left;padding:11px 12px;font-size:14.5px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14.5px}
.tbl tr:hover td{background:rgba(183,28,28,.03)}
.tbl tr.row-over td{background:rgba(198,40,40,.07)}
.tbl tr.row-today td{background:rgba(239,108,0,.07)}
.tbl tr.row-off td{opacity:.55}
.empty{text-align:center;color:var(--muted);padding:30px!important}
.nowrap{white-space:nowrap}
.subject{min-width:220px}
.sub{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-gray{background:#eceff1;color:#546e7a}.b-yellow{background:#fff8e1;color:#b26a00}.b-orange{background:#fff3e0;color:#e65100}
.b-red{background:#ffebee;color:#c62828}.b-blue{background:#e3f2fd;color:#1565c0}.b-green{background:#e8f5e9;color:#2e7d32}.b-purple{background:#f3e5f5;color:#6a1b9a}
.g-list{display:flex;flex-wrap:wrap;gap:4px;min-width:160px}
.footer-info{color:var(--muted);font-size:13px;margin-top:10px}
.link{color:var(--pri2);text-decoration:none;font-weight:600;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow-y:auto}
.modal-box{background:var(--card);border-radius:12px;width:100%;max-width:720px;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h3{margin:0;font-size:18px}
.x{background:none;border:0;font-size:26px;cursor:pointer;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.form-grid label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px}
.form-grid .input{width:100%}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--input)}
.form-grid label.chk{display:flex;align-items:center;gap:8px;margin:0;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--text);font-size:14.5px}
.form-grid label.chk:hover{background:var(--pri-soft)}
.chk input{width:17px;height:17px;accent-color:var(--pri);flex-shrink:0}
.req{color:#d32f2f}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:12px;padding:16px;cursor:pointer;transition:.15s}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.06)}
.stat.sel{outline:2px solid var(--pri);outline-offset:-1px}
.stat .n{font-size:28px;font-weight:700;color:var(--pri)}
.stat .n small{font-size:14px;font-weight:600}
.stat .l{color:var(--muted);font-size:14px}
.stat .d{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.bar-row{margin:10px 0;cursor:pointer}
.bar-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.bar{height:10px;background:var(--thead);border-radius:10px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.steps{display:flex;align-items:center}
.sdot{width:24px;height:24px;border-radius:50%;background:var(--thead);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sdot.on{color:#fff;border-color:transparent}
.sline{width:14px;height:2px;background:var(--line);display:inline-block}
.tl{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl:last-child{border-bottom:0}
.tl-dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex-shrink:0}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.lv-calc{background:var(--thead);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.role-desc{background:var(--thead);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13px;color:var(--muted)}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;z-index:100}
.spinner{width:44px;height:44px;border:4px solid #f3c6c6;border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:#323232;color:#fff;padding:12px 18px;border-radius:8px;opacity:0;transform:translateY(20px);transition:.25s;z-index:200;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:none}.toast.err{background:#c62828}.toast.ok{background:#2e7d32}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#b71c1c,#7f0000)}
.login-card{background:var(--card);width:100%;max-width:400px;border-radius:14px;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.login-card .logo{width:72px;height:72px;margin:0 auto 10px}
.login-card .input{width:100%;margin-bottom:12px}
.login-card .btn{width:100%}
.detail th{width:170px;background:var(--thead)}
.detail td{white-space:pre-line}
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.foot-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
@media(max-width:900px){
  .hamburger{display:inline-block}
  .sidebar{transform:translateX(-100%);transition:.2s}
  .sidebar.open{transform:none;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .main{margin-left:0;padding:84px 12px 20px}
  .brand small,.role-tag,.btn-top.hide-m{display:none}
  .user-label{max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .brand h1{font-size:15px}
  .form-grid,.grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="x" onclick="closeModal()">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="loading" class="loading hidden"><div class="spinner"></div></div>
<div id="toast" class="toast"></div>

<script>
const PAGES = {
  home:      { title: 'หน้าหลัก' },
  pending:   { title: 'แดชบอร์ดรอดำเนินการ' },
  incoming:  { title: 'ทะเบียนหนังสือรับ', type: 'incoming' },
  outgoing:  { title: 'ทะเบียนหนังสือส่ง', type: 'outgoing' },
  circular:  { title: 'ทะเบียนหนังสือเวียน', type: 'circular' },
  memo:      { title: 'ทะเบียนบันทึกข้อความ', type: 'memo' },
  order:     { title: 'ทะเบียนคำสั่ง', type: 'order' },
  announce:  { title: 'ทะเบียนประกาศ', type: 'announce' },
  personnel: { title: 'ทะเบียนประวัติบุคลากร' },
  leave:     { title: 'การลา' },
  study:     { title: 'ทะเบียนการลาศึกษาต่อ' },
  send:      { title: 'ส่งหนังสือถึงกลุ่มงานบุคคล' },
  all:       { title: 'หนังสือทั้งหมด', type: 'all' },
  users:     { title: 'จัดการผู้ใช้งาน', roles: ['admin'] }
};
const NAV = [
  { p: 'home', i: '🏠', t: 'หน้าหลัก' },
  { p: 'pending', i: '⏳', t: 'รอดำเนินการ', badge: 'navBadge' },
  { sec: 'ทะเบียนหนังสือ' },
  { p: 'incoming', i: '📥', t: 'ทะเบียนหนังสือรับ' },
  { p: 'outgoing', i: '📤', t: 'ทะเบียนหนังสือส่ง' },
  { p: 'circular', i: '📢', t: 'หนังสือเวียน' },
  { p: 'memo', i: '📝', t: 'บันทึกข้อความ' },
  { p: 'order', i: '📜', t: 'คำสั่ง' },
  { p: 'announce', i: '📣', t: 'ประกาศ' },
  { sec: 'งานบุคคล' },
  { p: 'personnel', i: '📇', t: 'ทะเบียนประวัติบุคลากร' },
  { p: 'leave', i: '🗓️', t: 'การลา', badge: 'navLeave' },
  { p: 'study', i: '🎓', t: 'การลาศึกษาต่อ' },
  { sec: 'ส่งหนังสือ' },
  { p: 'send', i: '📨', t: 'ส่งหนังสือถึงกลุ่มงานบุคคล' },
  { p: 'all', i: '🗂️', t: 'หนังสือทั้งหมด' },
  { sec: 'ผู้ดูแลระบบ', roles: ['admin'] },
  { p: 'users', i: '👥', t: 'จัดการผู้ใช้งาน', roles: ['admin'] }
];
const HIDE_FIELDS = {
  announce: ['docNo', 'fromOrg', 'toOrg', 'speed'],
  order: ['fromOrg', 'toOrg', 'speed']
};
const ROLE_DESC = {
  admin: 'จัดการผู้ใช้งานและสิทธิ์ เห็นทุกเมนู แก้ไข/ลบข้อมูลได้ทั้งหมด',
  staff: 'ลงรับ/มอบหมายหนังสือ พิจารณาอนุมัติใบลา ดูและจัดการการลาศึกษาต่อและประวัติบุคลากร',
  user: 'ส่งหนังสือ เขียนใบลา ยื่นลาศึกษาต่อ และเห็นเฉพาะรายการของตนเอง'
};
const ROLE_CLS = { admin: 'b-red', staff: 'b-blue', user: 'b-gray' };
const ROLE_ICON = { admin: '🛡️', staff: '📂', user: '👤' };
const ROLE_COLOR = { admin: '#c62828', staff: '#1565c0', user: '#546e7a' };
const DEGREES = ['ปริญญาตรี', 'ประกาศนียบัตรบัณฑิต', 'ปริญญาโท', 'ปริญญาเอก', 'อื่น ๆ'];
const STEP_COLORS = ['#1565c0', '#ef6c00', '#6a1b9a', '#2e7d32'];
const STEP_HINTS = [
  'แนบบันทึกขออนุญาตไปสมัครสอบ / ประกาศรับสมัคร',
  'แนบผลการสอบคัดเลือก / หนังสือตอบรับ / บันทึกขออนุญาตลาศึกษาต่อ',
  'แนบหลักฐานการสำเร็จการศึกษา (ใบรับรอง / ใบแสดงผลการศึกษา / ปริญญาบัตร)',
  'แนบหนังสือรายงานการเพิ่มวุฒิที่ สพม.สคสส.'
];
const LV_CLS = {
  'รออนุมัติ [ขั้นที่ 1: หัวหน้างาน]': 'b-orange',
  'รออนุมัติ [ขั้นที่ 2: หัวหน้างานการลา]': 'b-orange',
  'รออนุมัติ [ขั้นที่ 3: รอง ผอ.กลุ่มบริหารงานบุคคล]': 'b-orange',
  'รออนุมัติ [ขั้นที่ 4: ผู้อำนวยการโรงเรียน]': 'b-yellow',
  'อนุมัติแล้ว': 'b-green', 'ไม่อนุมัติ': 'b-red', 'ยกเลิก': 'b-gray'
};
const LV_ICON = { 'ลาป่วย': '🤒', 'ลากิจส่วนตัว': '📝', 'ลาพักผ่อน': '🏖️', 'ลาคลอดบุตร': '👶', 'ลาไปช่วยเหลือภริยาที่คลอดบุตร': '🍼', 'ลาอุปสมบท/ประกอบพิธีฮัจย์': '🙏', 'ลาอื่น ๆ': '📄' };
const LEAVE_CAL = ['ลาคลอดบุตร', 'ลาอุปสมบท/ประกอบพิธีฮัจย์'];
const LEAVE_MAIN = ['ลาป่วย', 'ลากิจส่วนตัว', 'ลาพักผ่อน'];
const SPEED_CLS = { 'ปกติ': 'b-gray', 'ด่วน': 'b-yellow', 'ด่วนมาก': 'b-orange', 'ด่วนที่สุด': 'b-red' };
const STATUS_CLS = { 'รอลงรับ': 'b-orange', 'ลงรับแล้ว': 'b-blue', 'กำลังดำเนินการ': 'b-yellow', 'เสร็จสิ้น': 'b-green', 'ยกเลิก': 'b-gray' };
const TM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const PF_LABEL = { all: 'ทั้งหมด', waiting: 'รอลงรับ', received: 'ลงรับแล้ว', progress: 'กำลังดำเนินการ', overdue: 'เกินกำหนด', today: 'ครบกำหนดวันนี้', urgent: 'ด่วนมาก/ด่วนที่สุด' };

const S = { token: localStorage.getItem('eds_token') || '', user: null, cfg: null, pub: null, page: 'home', type: '', list: [], pend: null };
let PF = { key: 'all', q: '', group: '', type: '' };
let SF = { q: '', step: '' };
let LF = { q: '', type: '', status: '', fy: null };
let UF = { q: '', role: '' };
let PF_PERSON = { q: '', group: '' };
let autoTimer = null;

const PAGE_SIZE = 10;
let PG = 1;
function goPage(p){ PG = p; drawTable(); }
function pagerHtml(total){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (pages <= 1) return '';
  let s = Math.max(1, PG - 2), e = Math.min(pages, s + 4);
  s = Math.max(1, e - 4);
  let h = `<button class="btn btn-sm btn-light" ${PG === 1 ? 'disabled' : ''} onclick="goPage(${PG - 1})">‹ ก่อนหน้า</button>`;
  for (let p = s; p <= e; p++) {
    h += `<button class="btn btn-sm ${p === PG ? 'btn-pri' : 'btn-light'}" onclick="goPage(${p})">${p}</button>`;
  }
  h += `<button class="btn btn-sm btn-light" ${PG === pages ? 'disabled' : ''} onclick="goPage(${PG + 1})">ถัดไป ›</button>`;
  return `<div class="pager">${h}</div>`;
}

const $ = s => document.querySelector(s);
const mainEl = () => document.getElementById('main');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function opts(arr, sel){ return (arr || []).map(v => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join(''); }
function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function thDate(s){
  if (!s) return '-';
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(s);
  const y = +m[1];
  return `${+m[3]} ${TM[+m[2]-1]} ${y > 2400 ? y : y + 543}`;
}
function thDateTime(s){ if(!s) return '-'; const t = String(s).match(/\s(\d{2}:\d{2})/); return thDate(s) + (t ? ' ' + t[1] + ' น.' : ''); }
function isStaff(){ return S.user && (S.user.role === 'admin' || S.user.role === 'staff'); }
function isAdmin(){ return S.user && S.user.role === 'admin'; }
function canSee(item){ return !item.roles || (S.user && item.roles.indexOf(S.user.role) >= 0); }
function isAnn(r){ return r && r.type === 'announce'; }
function isOrd(r){ return r && r.type === 'order'; }
function isMemo(r){ return r && r.type === 'memo'; }
function isNoParty(r){ return isAnn(r) || isOrd(r); }
function speedBadge(v){ return v ? `<span class="badge ${SPEED_CLS[v]||'b-gray'}">${esc(v)}</span>` : '-'; }
function statusBadge(v){ return v ? `<span class="badge ${STATUS_CLS[v]||'b-gray'}">${esc(v)}</span>` : '-'; }
function roleBadge(r){ return `<span class="badge ${ROLE_CLS[r]||'b-gray'}">${ROLE_ICON[r]||''} ${esc((S.cfg.roles||{})[r]||r)}</span>`; }
function fileLink(r){ return r.fileUrl ? `<a class="link nowrap" href="${esc(r.fileUrl)}" target="_blank" rel="noopener">📎 เปิดไฟล์</a>` : '-'; }
function party(r){ if (isNoParty(r)) return '-'; return (r.type === 'incoming' ? (r.fromOrg || r.toOrg) : (r.toOrg || r.fromOrg)) || '-'; }
function docNoOf(r){ return isAnn(r) ? '-' : (r.docNo || '-'); }
function docNoLabel(r){ return isOrd(r) ? 'เลขที่คำสั่ง' : (isMemo(r) ? 'เลขที่บันทึกข้อความ' : 'เลขที่หนังสือ'); }
function speedOf(r){ return isNoParty(r) ? '-' : speedBadge(r.speed); }

function groupsOf(r){ return String((r && r.groupName) || '').split(/\s*,\s*/).map(x => x.trim()).filter(Boolean); }
function hasGroup(r, g){ return groupsOf(r).indexOf(g) >= 0; }
function groupHtml(r){
  const g = groupsOf(r);
  return g.length ? `<div class="g-list">${g.map(x => `<span class="badge b-blue">${esc(x)}</span>`).join('')}</div>` : '';
}
function groupPicker(selected){
  const sel = selected || [];
  const list = (S.cfg.groups || []).slice();
  sel.forEach(g => { if (list.indexOf(g) < 0) list.push(g); });
  return `<div class="chk-grid" id="gPick">${list.map(g =>
    `<label class="chk"><input type="checkbox" value="${esc(g)}" ${sel.indexOf(g) >= 0 ? 'checked' : ''}><span>${esc(g)}</span></label>`).join('')}</div>
    <div class="sub" style="margin-top:6px"><a class="link" onclick="pickAll(true)">☑ เลือกทั้งหมด</a> · <a class="link" onclick="pickAll(false)">ล้าง</a></div>`;
}
function pickAll(on){ document.querySelectorAll('#gPick input').forEach(c => c.checked = on); }
function pickedGroups(){ return Array.from(document.querySelectorAll('#gPick input:checked')).map(c => c.value); }

function logoHtml(){

let loadCount = 0;
function showLoading(on){ loadCount += on ? 1 : -1; if (loadCount < 0) loadCount = 0; $('#loading').classList.toggle('hidden', loadCount === 0); }
let tTimer;
function toast(m, type){ const t = $('#toast'); t.textContent = m; t.className = 'toast show ' + (type || ''); clearTimeout(tTimer); tTimer = setTimeout(() => t.className = 'toast', 3500); }
function openModal(title, html){ $('#modalTitle').textContent = title; $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#modalBody').innerHTML = ''; }

function confirmBox(title, msg, okText, danger, icon, sub){
  return new Promise(res => {
    openModal(title, `
      <div style="text-align:center;padding:10px 0 20px">
        ${icon ? `<div style="font-size:42px;margin-bottom:10px">${icon}</div>` : ''}
        <div style="font-size:16px;font-weight:600;margin-bottom:6px">${esc(msg)}</div>
        ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
      </div>
      <div class="form-actions" style="justify-content:center;gap:12px">
        <button type="button" class="btn btn-light" style="min-width:110px" id="cbNo">ยกเลิก</button>
        <button type="button" class="btn btn-pri" style="min-width:110px${danger ? ';background:#c62828' : ''}" id="cbYes">${esc(okText || 'ตกลง')}</button>
      </div>`);
    $('#cbNo').onclick = () => { closeModal(); res(false); };
    $('#cbYes').onclick = () => { closeModal(); res(true); };
  });
}

function api(fn, ...args){
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
async function call(fn, ...args){
  showLoading(true);
  try { return await api(fn, ...args); }
  catch (e) { handleErr(e); throw e; }
  finally { showLoading(false); }
}
function handleErr(e){
  const m = (e && e.message) || String(e);
  if (m.indexOf('SESSION_EXPIRED') >= 0) { doLogoutLocal(); toast('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่', 'err'); }
  else toast(m.replace(/^Error:\s*/, ''), 'err');
}
function readFile(input){
  return new Promise((res, rej) => {
    const f = input && input.files && input.files[0];
    if (!f) return res(null);
    const max = ((S.cfg && S.cfg.app.maxFileMb) || 10) * 1024 * 1024;
    if (f.size > max) return rej(new Error('ไฟล์ต้องไม่เกิน ' + (max/1024/1024) + ' MB'));
    const r = new FileReader();
    r.onload = () => res({ name: f.name, mimeType: f.type, base64: String(r.result).split(',')[1] });
    r.onerror = () => rej(new Error('อ่านไฟล์ไม่สำเร็จ'));
    r.readAsDataURL(f);
  });
}

function setBadgeEl(id, n){ const b = document.getElementById(id); if (!b) return; b.textContent = n; b.classList.toggle('hidden', !n); }
function setBadge(n){ setBadgeEl('navBadge', n); }
function setLeaveBadge(n){ setBadgeEl('navLeave', n); }
function refreshBadge(){
  if (!S.token) return;
  api('getBadges', S.token).then(b => { setBadge(b.pending); setLeaveBadge(b.leave); }).catch(() => {});
}
function startAuto(){
  clearInterval(autoTimer);
  autoTimer = setInterval(() => {
    if (!S.token) return;
    const typing = document.activeElement && document.activeElement.id === 'pq';
    if (S.page === 'pending' && $('#modal').classList.contains('hidden') && !typing) loadPending();
    refreshBadge();
  }, 120000);
}
function reloadPage(){
  if (S.page === 'pending') loadPending();
  else if (S.page === 'send') loadMine();
  else if (S.page === 'home') renderHome();
  else if (S.page === 'study') loadStudy();
  else if (S.page === 'leave') loadLeave();
  else if (S.page === 'personnel') loadPersonnel();
  else if (S.page === 'users') loadUsers();
  else loadDocs();
  refreshBadge();
}

window.addEventListener('load', async () => {
  if (localStorage.getItem('eds_theme') === 'dark') document.body.classList.add('dark');
  showLoading(true);
  try {
    S.pub = await api('getPublicConfig');
    if (S.token) {
      const b = await api('getBootstrap', S.token);
      startSession(b, localStorage.getItem('eds_page') || 'home');
      return;
    }
  } catch (e) {
    const m = (e && e.message) || '';
    if (m.indexOf('SESSION_EXPIRED') < 0) toast(m, 'err');
    localStorage.removeItem('eds_token'); S.token = '';
  } finally { showLoading(false); }
  renderLogin();
});

function startSession(b, page){
  S.cfg = b; S.user = b.user;
  renderShell(); setBadge(b.pendingCount || 0); setLeaveBadge(b.leavePending || 0); startAuto(); go(page);
}

function go(page, keepFilter){
  if (!PAGES[page] || !canSee(PAGES[page])) page = 'home';
  if (page === 'pending' && !keepFilter) PF = { key: 'all', q: '', group: '', type: '' };
  S.page = page; localStorage.setItem('eds_page', page);
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.p === page));
  $('#sidebar').classList.remove('open');
  if (page === 'home') renderHome();
  else if (page === 'pending') renderPending();
  else if (page === 'send') renderSend();
  else if (page === 'study') renderStudy();
  else if (page === 'leave') renderLeave();
  else if (page === 'personnel') renderPersonnel();
  else if (page === 'users') renderUsers();
  else renderRegister(page);
}
function goPending(key){ PF = { key: key || 'all', q: '', group: '', type: '' }; go('pending', true); }

async function loadPending(withSpinner){
  let d;
  if (withSpinner) showLoading(true);
  try { d = await api('getPendingDashboard', S.token); }
  catch (e) { handleErr(e); return; }
  finally { if (withSpinner) showLoading(false); }
  if (S.page !== 'pending') return;
  S.pend = d; S.list = d.items;
  setBadge(d.summary.total);
  const n = new Date();
  if ($('#pUpdated')) $('#pUpdated').textContent = 'อัปเดตล่าสุด ' + String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0') + ' น. ';
  drawPending();
}

    </div>
    <div class="table-wrap"><table class="tbl"><thead><tr>
      <th>#</th><th>ประเภท</th><th>เลขรับ / เลขที่</th><th>เรื่อง</th><th>ชั้นความเร็ว</th><th>กลุ่มงานที่รับผิดชอบ</th><th>สถานะ</th><th>รอมาแล้ว</th><th>กำหนดเสร็จ</th><th>จัดการ</th>
    </tr></thead><tbody id="ptbody"></tbody></table></div>
    <div class="footer-info" id="pcount"></div>
  </div>`;

  $('#pq').oninput = e => { PF.q = e.target.value; drawPendingTable(); };
  $('#pt').onchange = e => { PF.type = e.target.value; drawPendingTable(); };
  $('#pg').onchange = e => { PF.group = e.target.value; drawPendingTable(); };
  drawPendingTable();
}

function pendingFiltered(){
  const q = (PF.q || '').trim().toLowerCase();
  return S.list.filter(r => {
    switch (PF.key) {
      case 'waiting':  if (r.status !== 'รอลงรับ') return false; break;
      case 'received': if (r.status !== 'ลงรับแล้ว') return false; break;
      case 'progress': if (r.status !== 'กำลังดำเนินการ') return false; break;
      case 'overdue':  if (!r.overdue) return false; break;
      case 'today':    if (r.daysLeft !== 0) return false; break;
      case 'urgent':   if (isNoParty(r) || (r.speed !== 'ด่วนมาก' && r.speed !== 'ด่วนที่สุด')) return false; break;
    }
    if (PF.group) {
      if (PF.group === '__none') { if (groupsOf(r).length) return false; }
      else if (!hasGroup(r, PF.group)) return false;
    }
    if (PF.type && r.type !== PF.type) return false;
    if (q && ![r.regNo, r.docNo, r.fromOrg, r.toOrg, r.subject, r.groupName].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}

function dueBadge(r){
  if (r.daysLeft === undefined) return '';
  if (r.overdue) return `<span class="badge b-red">เกิน ${-r.daysLeft} วัน</span>`;
  if (r.daysLeft === 0) return `<span class="badge b-orange">ครบวันนี้</span>`;
  if (r.daysLeft <= 2) return `<span class="badge b-yellow">อีก ${r.daysLeft} วัน</span>`;
  return `<span class="badge b-green">อีก ${r.daysLeft} วัน</span>`;
}

function pendingActions(r){
  let h = `<button class="btn btn-sm btn-light" onclick="viewDoc('${r.id}')">ดู</button> `;
  if (isStaff()) {
    if (r.status === 'รอลงรับ' && r.type === 'incoming') {
      h += `<button class="btn btn-sm btn-ok" onclick="receiveDoc('${r.id}')">ลงรับ</button> `;
    } else {
      if (r.status !== 'กำลังดำเนินการ') h += `<button class="btn btn-sm btn-info" onclick="quickStatus('${r.type}','${r.id}','กำลังดำเนินการ')">เริ่มดำเนินการ</button> `;
      h += `<button class="btn btn-sm btn-ok" onclick="quickStatus('${r.type}','${r.id}','เสร็จสิ้น')">✓ เสร็จสิ้น</button> `;
    }
    h += `<button class="btn btn-sm btn-light" onclick="openAssign('${r.type}','${r.id}')">มอบหมาย</button>`;
  }
  return `<div class="nowrap">${h}</div>`;
}

function drawPendingTable(){
  if (!$('#ptbody')) return;
  const rows = pendingFiltered();
  $('#ptbody').innerHTML = rows.length ? rows.map((r, i) => `
    <tr class="${r.overdue ? 'row-over' : (r.daysLeft === 0 ? 'row-today' : '')}">
      <td>${i + 1}</td>
      <td><span class="badge b-purple">${esc(r.typeLabel)}</span></td>
      <td class="nowrap">${r.regNo ? `<b>${esc(r.regNo)}</b><br>` : ''}<span class="sub">${esc(docNoOf(r))}</span></td>
      <td><div class="subject">${esc(r.subject)}</div>${isNoParty(r) ? '' : `<div class="sub">${esc(party(r))}</div>`}</td>
      <td>${speedOf(r)}</td>
      <td>${groupsOf(r).length ? groupHtml(r) : '<span class="badge b-gray">ยังไม่มอบหมาย</span>'}</td>
      <td>${statusBadge(r.status)}</td>
      <td class="nowrap">${r.ageDays} วัน</td>
      <td class="nowrap">${thDate(r.dueCalc)}<br>${dueBadge(r)}</td>
      <td>${pendingActions(r)}</td>
    </tr>`).join('')
    : `<tr><td colspan="10" class="empty">${S.list.length ? 'ไม่พบข้อมูลตามตัวกรอง' : 'ไม่มีงานค้าง 🎉'}</td></tr>`;
  $('#pcount').textContent = `แสดง ${rows.length} จาก ${S.list.length} รายการ`;
}

async function quickStatus(type, id, status){
  if (status === 'เสร็จสิ้น' && !(await confirmBox('ยืนยันสถานะ', 'ยืนยันว่าดำเนินการเรื่องนี้เสร็จสิ้นแล้ว?', 'ยืนยัน', false, '✅'))) return;
  try {
    await call('updateStatus', S.token, type, id, { status: status });
    toast('อัปเดตสถานะเป็น "' + status + '" เรียบร้อย', 'ok');
    reloadPage();
  } catch (e) {}
}

function openAssign(type, id){
  const r = S.list.find(x => x.id === id); if (!r) return;
  const multi = type === 'incoming';
  const groupField = multi
    ? `<div class="full"><label>มอบหมายกลุ่มงานที่รับผิดชอบ (เลือกได้หลายกลุ่ม)</label>${groupPicker(groupsOf(r))}</div>`
    : `<div><label>มอบหมายกลุ่มงาน</label><select class="input" name="groupName"><option value="">- ไม่ระบุ -</option>${opts(S.cfg.groups, r.groupName)}</select></div>`;
  openModal('มอบหมาย / อัปเดตสถานะ', `
  <div class="sub" style="margin-bottom:12px"><b>${esc(r.typeLabel)}${r.regNo ? ' เลขรับ ' + esc(r.regNo) : ''}:</b> ${esc(r.subject)}</div>
  <form id="asForm"><div class="form-grid">
    <div><label>สถานะ</label><select class="input" name="status">${opts(S.cfg.statuses, r.status)}</select></div>
    ${multi ? '' : groupField}
    <div><label>กำหนดเสร็จ</label><input type="date" class="input" name="dueDate" value="${esc(r.dueDate || r.dueCalc || '')}"></div>
    ${isNoParty(r) ? '<div></div>' : `<div><label>ชั้นความเร็ว</label><input class="input" value="${esc(r.speed || 'ปกติ')}" disabled></div>`}
    ${multi ? groupField : ''}
    <div class="full"><label>บันทึกความคืบหน้า / ข้อสั่งการ</label><textarea class="input" name="note" rows="3" placeholder="ข้อความจะถูกต่อท้ายในหมายเหตุ พร้อมวันเวลาและชื่อผู้บันทึก"></textarea></div>
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-light" onclick="closeModal()">ยกเลิก</button>
    <button type="submit" class="btn btn-pri">บันทึก</button>
  </div></form>`);
  $('#asForm').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const groups = multi ? pickedGroups() : (fd.get('groupName') || '');
    const p = { status: fd.get('status'), groupName: groups, dueDate: fd.get('dueDate') || '', note: fd.get('note') || '' };
    try {
      await call('updateStatus', S.token, type, id, p);
      closeModal();
      toast(multi && groups.length ? 'มอบหมายให้ ' + groups.length + ' กลุ่มงานเรียบร้อย' : 'บันทึกเรียบร้อย', 'ok');
      reloadPage();
    } catch (e) {}
  };
}

function columnsFor(type){
  const ann = type === 'announce', ord = type === 'order', memo = type === 'memo', nop = ann || ord;
  const c = [{ k: '#', l: '#' }];
  if (type === 'incoming') c.push({ k: 'regNo', l: 'เลขรับ' });
  if (!ann) c.push({ k: 'docNo', l: ord ? 'เลขที่คำสั่ง' : (memo ? 'เลขที่บันทึกข้อความ' : (type === 'all' ? 'เลขที่' : 'เลขที่หนังสือ')) });
  c.push({ k: 'docDate', l: 'ลงวันที่' });
  if (!nop) c.push({ k: 'party', l: 'จาก/ถึง' });
  c.push({ k: 'subject', l: 'เรื่อง' });
  if (!nop) c.push({ k: 'speed', l: 'ชั้นความเร็ว' });
  if (!nop) c.push({ k: 'status', l: 'สถานะ' });
  c.push({ k: 'file', l: 'ไฟล์แนบ' });
  if (type === 'all') c.push({ k: 'typeLabel', l: 'ประเภท' });
  c.push({ k: 'act', l: 'จัดการ' });
  return c;
}

function cell(k, r, i){
  switch (k) {
    case '#': return i + 1;
    case 'regNo': return `<span class="nowrap">${esc(r.regNo || '-')}</span>`;
    case 'docNo': return `<span class="nowrap">${esc(docNoOf(r))}</span>`;
    case 'docDate': return `<span class="nowrap">${thDate(r.docDate)}</span>`;
    case 'party': return esc(party(r));
    case 'subject': return `<div class="subject">${esc(r.subject)}</div>${groupsOf(r).length ? `<div style="margin-top:4px">${groupHtml(r)}</div>` : ''}`;
    case 'speed': return speedOf(r);
    case 'status': return isNoParty(r) ? '-' : statusBadge(r.status);
    case 'file': return fileLink(r);
    case 'typeLabel': return `<span class="badge b-purple">${esc(r.typeLabel)}</span>`;
    case 'act': return actCell(r);
  }
  return '';
}

function actCell(r){
  let h = `<button class="btn btn-sm btn-light" onclick="viewDoc('${r.id}')">ดู</button> `;
  if (isStaff()) {
    if (r.type === 'incoming' && r.status === 'รอลงรับ') h += `<button class="btn btn-sm btn-ok" onclick="receiveDoc('${r.id}')">ลงรับ</button> `;
    if (r.type === 'incoming') h += `<button class="btn btn-sm btn-info" onclick="openAssign('incoming','${r.id}')">มอบหมาย</button> `;
    h += `<button class="btn btn-sm btn-light" onclick="openDocForm('${r.type}','${r.id}')">แก้ไข</button> `;
    h += `<button class="btn btn-sm btn-del" onclick="delDoc('${r.type}','${r.id}')">ลบ</button>`;
  }
  return `<div class="nowrap">${h}</div>`;
}

function renderRegister(page){
  const p = PAGES[page], type = p.type;
  S.type = type; S.list = [];
  const cols = columnsFor(type);
  const nop = type === 'announce' || type === 'order';
  mainEl().innerHTML = `
  <h2 class="page-title">${p.title}</h2>
  <div class="card">
    <div class="toolbar">
      <input id="q" class="input grow" placeholder="${nop ? 'ค้นหาเลขที่ / เรื่อง' : 'ค้นหาเลขที่ / เรื่อง / หน่วยงาน'}">
      ${nop ? '' : `<select id="fStatus" class="input"><option value="">ทุกสถานะ</option>${opts(S.cfg.statuses)}</select>`}
      ${type === 'incoming' ? `<select id="fGroup" class="input"><option value="">ทุกกลุ่มงาน</option>${opts(S.cfg.groups)}</select>` : ''}
      ${isStaff() ? `<button class="btn btn-pri" onclick="openDocForm('${type}')">+ เพิ่มหนังสือ</button>` : ''}
    </div>
    <div class="table-wrap"><table class="tbl ${nop ? 'compact' : ''}">
      <thead><tr>${cols.map(c => `<th>${c.l}</th>`).join('')}</tr></thead>
      <tbody id="tbody"><tr><td colspan="${cols.length}" class="empty">กำลังโหลด...</td></tr></tbody>
    </table></div>
    <div class="footer-info" id="countInfo"></div>
  </div>`;
  PG = 1;
  $('#q').oninput = () => { PG = 1; drawTable(); };
  if ($('#fStatus')) $('#fStatus').onchange = () => { PG = 1; drawTable(); };
  if ($('#fGroup')) $('#fGroup').onchange = () => { PG = 1; drawTable(); };
  loadDocs();
}

async function loadDocs(){
  const type = S.type;
  if (!PAGES[S.page] || !PAGES[S.page].type) return;
  try {
    const list = await api('listDocs', S.token, type);
    if (S.type !== type) return;
    S.list = list; drawTable();
  } catch (e) { handleErr(e); }
}

function drawTable(){
  if (!$('#tbody')) return;
  const q = ($('#q').value || '').trim().toLowerCase();
  const st = $('#fStatus') ? $('#fStatus').value : '';
  const g = $('#fGroup') ? $('#fGroup').value : '';
  const rows = S.list.filter(r =>
    (!st || r.status === st) && (!g || hasGroup(r, g)) &&
    (!q || [r.regNo, r.docNo, r.fromOrg, r.toOrg, r.subject, r.groupName, r.note].join(' ').toLowerCase().includes(q)));

  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (PG > pages) PG = pages;
  if (PG < 1) PG = 1;
  const start = (PG - 1) * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);

  const cols = columnsFor(S.type);
  $('#tbody').innerHTML = pageRows.length
    ? pageRows.map((r, i) => '<tr>' + cols.map(c => `<td>${cell(c.k, r, start + i)}</td>`).join('') + '</tr>').join('')
    : `<tr><td colspan="${cols.length}" class="empty">ไม่พบข้อมูล</td></tr>`;

  const from = rows.length ? start + 1 : 0;
  const to = Math.min(start + PAGE_SIZE, rows.length);
  $('#countInfo').innerHTML = `<div class="foot-row">
    <span>แสดง ${from}–${to} จาก ${rows.length} รายการ (หน้า ${PG}/${pages})</span>
    ${pagerHtml(rows.length)}
  </div>`;
}

function applyFormType(t){
  const hide = (HIDE_FIELDS[t] || []).slice();
  if (t === 'incoming') hide.push('grpSingle'); else hide.push('regNo', 'grpMulti');
  document.querySelectorAll('#docForm [data-f]').forEach(el => el.classList.toggle('hidden', hide.indexOf(el.dataset.f) >= 0));
  const lbl = $('#lblDocNo'); 
  if (lbl) lbl.textContent = t === 'order' ? 'เลขที่คำสั่ง' : (t === 'memo' ? 'เลขที่บันทึกข้อความ' : 'เลขที่หนังสือ');
  const inp = document.querySelector('#docForm [name=docNo]');
  if (inp) inp.placeholder = t === 'incoming' ? 'เช่น ศธ 04xxx/123' : 'เว้นว่าง = ออกเลขอัตโนมัติ';
}

function openDocForm(type, id){
  const d = id ? S.list.find(x => x.id === id) : null;
  const r = d || { docDate: today(), speed: 'ปกติ' };
  const chooseType = !d && type === 'all';
  const t = chooseType ? 'incoming' : (d ? d.type : type);
  openModal((d ? 'แก้ไข' : 'เพิ่ม') + (chooseType ? 'หนังสือ' : S.cfg.types[t]), `
  <form id="docForm"><div class="form-grid">
    ${chooseType ? `<div class="full"><label>ประเภทหนังสือ <span class="req">*</span></label>
      <select class="input" name="type" id="fType">${Object.keys(S.cfg.types).map(k => `<option value="${k}">${esc(S.cfg.types[k])}</option>`).join('')}</select></div>` : ''}
    <div data-f="regNo"><label>เลขรับ</label><input class="input" name="regNo" value="${esc(r.regNo || '')}" placeholder="เว้นว่าง = ออกเลขอัตโนมัติ"></div>
    <div data-f="docNo"><label id="lblDocNo">เลขที่หนังสือ</label><input class="input" name="docNo" value="${esc(r.docNo || '')}"></div>
    <div><label>ลงวันที่</label><input type="date" class="input" name="docDate" value="${esc(r.docDate || '')}"></div>
    <div data-f="speed"><label>ชั้นความเร็ว</label><select class="input" name="speed">${opts(S.cfg.speeds, r.speed || 'ปกติ')}</select></div>
    <div data-f="fromOrg"><label>จาก</label><input class="input" name="fromOrg" value="${esc(r.fromOrg || '')}"></div>
    <div data-f="toOrg"><label>ถึง</label><input class="input" name="toOrg" value="${esc(r.toOrg || '')}"></div>
    <div class="full"><label>เรื่อง <span class="req">*</span></label><textarea class="input" name="subject" rows="2" required>${esc(r.subject || '')}</textarea></div>
    <div class="full" data-f="grpMulti"><label>กลุ่มงานที่รับผิดชอบ (เลือกได้หลายกลุ่ม)</label>${groupPicker(groupsOf(r))}</div>
    <div data-f="grpSingle"><label>กลุ่มงานที่รับผิดชอบ</label><select class="input" name="groupName"><option value="">- ไม่ระบุ -</option>${opts(S.cfg.groups, groupsOf(r)[0] || '')}</select></div>
    <div><label>สถานะ</label><select class="input" name="status"><option value="">(ค่าเริ่มต้น)</option>${opts(S.cfg.statuses, r.status)}</select></div>
    <div><label>กำหนดเสร็จ</label><input type="date" class="input" name="dueDate" value="${esc(r.dueDate || '')}"><div class="sub">เว้นว่าง = คำนวณตามชั้นความเร็ว</div></div>
    <div class="full"><label>ไฟล์แนบ (ไม่เกิน ${S.cfg.app.maxFileMb} MB)</label>
      <input type="file" class="input" id="fFile">
      ${r.fileUrl ? `<div class="sub" style="margin-top:6px">ไฟล์ปัจจุบัน: <a class="link" href="${esc(r.fileUrl)}" target="_blank">${esc(r.fileName || 'เปิดไฟล์')}</a> (อัปโหลดใหม่เพื่อแทนที่)</div>` : ''}</div>
    <div class="full"><label>หมายเหตุ</label><textarea class="input" name="note" rows="2">${esc(r.note || '')}</textarea></div>
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn-light" onclick="closeModal()">ยกเลิก</button>

  </div></form>`);
  applyFormType(t);

  $('#docForm').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const ty = chooseType ? fd.get('type') : t;
    const data = {};
    ['regNo','docNo','docDate','speed','fromOrg','toOrg','subject','status','note','dueDate'].forEach(k => data[k] = fd.get(k) || '');
    data.groupName = ty === 'incoming' ? pickedGroups().join(', ') : (fd.get('groupName') || '');
    (HIDE_FIELDS[ty] || []).forEach(k => data[k] = '');
    if (d) data.id = d.id;
    let file;
    try { file = await readFile($('#fFile')); } catch (e) { return toast(e.message, 'err'); }
    try {
      await call('saveDoc', S.token, ty, data, file);
      closeModal(); toast('บันทึกข้อมูลเรียบร้อย', 'ok'); reloadPage();
    } catch (e) {}
  };
}

function viewDoc(id){
  const r = S.list.find(x => x.id === id);
  if (!r) return;
  const nop = isNoParty(r);
  const due = r.dueDate ? thDate(r.dueDate) : (r.dueCalc ? thDate(r.dueCalc) + ' (คำนวณอัตโนมัติ)' : '');
  const rows = [
    ['ประเภท', esc(r.typeLabel)], ['เลขรับ', esc(r.regNo)],
    [docNoLabel(r), isAnn(r) ? '' : esc(r.docNo)],
    ['ลงวันที่', r.docDate ? thDate(r.docDate) : ''],
    ['จาก', nop ? '' : esc(r.fromOrg)], ['ถึง', nop ? '' : esc(r.toOrg)],
    ['เรื่อง', esc(r.subject)],
    ['ชั้นความเร็ว', nop ? '' : speedBadge(r.speed)],
    ['กลุ่มงานที่รับผิดชอบ', groupHtml(r)],
    ['สถานะ', nop ? '' : statusBadge(r.status)],
    ['กำหนดเสร็จ', due ? due + ' ' + dueBadge(r) : ''],
    ['ไฟล์แนบ', r.fileUrl ? fileLink(r) : ''], ['หมายเหตุ', esc(r.note)],
    ['ช่องทาง', esc(r.source)], ['ผู้บันทึก', esc(r.createdBy)],
    ['วันที่บันทึก', r.createdAt ? thDateTime(r.createdAt) : ''],
    ['แก้ไขล่าสุด', r.updatedAt ? thDateTime(r.updatedAt) : '']
  ];
  openModal('รายละเอียดหนังสือ', `<table class="tbl detail" style="min-width:0">${rows.filter(x => x[1] && x[1] !== '-').map(x => `<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')}</table>
    <div class="form-actions"><button class="btn btn-light" onclick="closeModal()">ปิด</button></div>`);
}

async function receiveDoc(id){
  if (!(await confirmBox('ยืนยันการลงรับ', 'ยืนยันการลงรับหนังสือนี้?', 'ลงรับ', false, '📥'))) return;

    const no = await call('receiveDoc', S.token, id);

}

async function delDoc(type, id){

  try { await call('deleteDoc', S.token, type, id); toast('ลบเรียบร้อย', 'ok'); reloadPage(); } catch (e) {}
}

function renderPersonnel(){
  S.type = 'personnel'; S.list = [];
  mainEl().innerHTML = `
  <div class="head-row">
    <h2 class="page-title" style="margin:0">ทะเบียนประวัติบุคลากร</h2>

async function loadPersonnel(){
  try {
    const list = await api('listPersonnel', S.token);
    if (S.page !== 'personnel') return;
    S.list = list || [];
    drawPersonnel();
  } catch (e) { handleErr(e); }
}

function drawPersonnel(){
  if (!$('#perBody')) return;
  const q = (PF_PERSON.q || '').trim().toLowerCase();
  const grp = PF_PERSON.group;
  const rows = S.list.filter(r =>
    (!grp || r.groupName === grp) &&
    (!q || [r.prefix, r.fullName, r.position, r.academicStanding, r.groupName, r.phone, r.email, r.education, r.idCard].join(' ').toLowerCase().includes(q)));
  $('#perBody').innerHTML = rows.length ? rows.map((r, i) => `<tr>
    <td>${i + 1}</td>
    <td><b>${esc((r.prefix || '') + ' ' + r.fullName)}</b>${r.idCard ? `<div class="sub">เลข ปชช: ${esc(r.idCard)}</div>` : ''}</td>
    <td>${esc(r.position || '-')}${r.academicStanding ? `<br><span class="badge b-blue">${esc(r.academicStanding)}</span>` : ''}</td>
    <td>${esc(r.groupName || '-')}</td>
    <td>${esc(r.phone || '-')}${r.email ? `<br><span class="sub">${esc(r.email)}</span>` : ''}</td>
    <td>${esc(r.education || '-')}</td>
    <td>${fileLink(r)}</td>
    <td><button class="btn btn-sm btn-light" onclick="viewPersonnel('${r.id}')">ดู</button>
      ${isStaff() ? `<button class="btn btn-sm btn-light" onclick="openPersonnelForm('${r.id}')">แก้ไข</button> <button class="btn btn-sm btn-del" onclick="delPersonnel('${r.id}')">ลบ</button>` : ''}</td>
  </tr>`).join('') : `<tr><td colspan="8" class="empty">ไม่พบประวัติบุคลากร</td></tr>`;
  $('#perCount').textContent = `แสดง ${rows.length} จาก ${S.list.length} คน`;
}

    <div><label>คำนำหน้า</label><select class="input" name="prefix">${opts(['นาย', 'นาง', 'นางสาว', 'ดร.', 'ผศ.', 'รศ.'], r.prefix)}</select></div>

    <div><label>เบอร์โทรศัพท์</label><input class="input" name="phone" value="${esc(r.phone || '')}"></div>
    <div><label>อีเมล</label><input type="email" class="input" name="email" value="${esc(r.email || '')}"></div>
    <div><label>วุฒิการศึกษาสูงสุด</label><input class="input" name="education" value="${esc(r.education || '')}" placeholder="เช่น ปริญญาโท (กศ.ม.)"></div>
    <div class="full"><label>ที่อยู่ปัจจุบัน</label><textarea class="input" name="address" rows="2">${esc(r.address || '')}</textarea></div>
    <div class="full"><label>รูปถ่าย / เอกสารประวัติ</label>
      <input type="file" class="input" id="perFile">
      ${r.fileUrl ? `<div class="sub" style="margin-top:6px">ไฟล์ปัจจุบัน: <a class="link" href="${esc(r.fileUrl)}" target="_blank">${esc(r.fileName || 'เปิดไฟล์')}</a></div>` : ''}</div>
    <div class="full"><label>หมายเหตุ</label><textarea class="input" name="note" rows="2">${esc(r.note || '')}</textarea></div>

  <div class="form-actions">

  $('#perForm').onsubmit = async ev => {

    try {
      await call('savePersonnel', S.token, data, file);
      closeModal(); toast('บันทึกข้อมูลบุคลากรเรียบร้อย', 'ok'); loadPersonnel();

async function delPersonnel(id){
  if (!(await confirmBox('ยืนยันการลบ', 'ต้องการลบประวัติบุคลากรนี้?', 'ลบ', true, '🗑️'))) return;
  try { await call('deletePersonnel', S.token, id); toast('ลบเรียบร้อย', 'ok'); loadPersonnel(); } catch (e) {}
}

function curFY(){ const d = new Date(); return (d.getMonth() >= 9 ? d.getFullYear() + 1 : d.getFullYear()) + 543; }
function fmtDays(n){ n = Number(n) || 0; return (n % 1 ? n.toFixed(1) : n) + ' วัน'; }
function lvType(t){ return (LV_ICON[t] || '📄') + ' ' + esc(t || '-'); }
function lvBadge(s){ return `<span class="badge ${LV_CLS[s] || 'b-gray'}">${esc(s || '-')}</span>`; }
function lvRange(r){
  const p = r.period && r.period !== 'เต็มวัน' ? ' (' + esc(r.period) + ')' : '';
  return (!r.endDate || r.startDate === r.endDate) ? thDate(r.startDate) + p : thDate(r.startDate) + ' – ' + thDate(r.endDate);
}
function calcLeave(s, e, per, ty){
  if (!s || !e) return { err: 'กรุณาระบุวันที่ลาให้ครบ' };
  const dn = x => { const m = x.split('-'); return Math.floor(Date.UTC(+m[0], +m[1] - 1, +m[2]) / 86400000); };
  const a = dn(s), b = dn(e);
  if (b < a) return { err: 'วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่มลา' };
  if (per && per !== 'เต็มวัน') return a !== b ? { err: 'การลาครึ่งวันต้องเป็นวันเดียวกัน' } : { days: 0.5 };
  if (LEAVE_CAL.indexOf(ty) >= 0) return { days: b - a + 1 };
  let n = 0;
  for (let d = a; d <= b; d++) { const w = (d + 4) % 7; if (w !== 0 && w !== 6) n++; }
  return n ? { days: n } : { err: 'ช่วงวันที่เลือกเป็นวันเสาร์-อาทิตย์ทั้งหมด' };
}

  S.type = 'leave'; S.list = [];
  if (LF.fy === null) LF.fy = String(curFY());
